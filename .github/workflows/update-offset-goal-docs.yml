name: Update offset goal docs

on:
  push:
    branches:
      - feat/tabakon-offset-goals-zigzag

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[offset-goal-docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update docs
        run: python3 tools/update_offset_goal_docs.py
      - name: Validate staged diff
        run: |
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/update-offset-goal-docs.yml
          test ! -e tools/update_offset_goal_docs.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: synchronize offset goal gameplay state [offset-goal-docs]"
          git push

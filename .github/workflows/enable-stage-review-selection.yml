name: Enable stage review selection

on:
  push:
    branches:
      - feat/tabakon-offset-goals-zigzag

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[stage-review-selector]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply selector and docs update
        run: python3 tools/enable_stage_review_selection.py
      - name: Validate staged diff
        run: |
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/enable-stage-review-selection.yml
          test ! -e tools/enable_stage_review_selection.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: allow fixed review selection for all stages [stage-review-selector]"
          git push

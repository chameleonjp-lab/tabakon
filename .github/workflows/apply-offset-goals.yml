name: Apply offset goals and zigzag barriers

on:
  push:
    branches:
      - feat/tabakon-offset-goals-zigzag

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[offset-goals-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted patch and validate
        run: python3 tools/apply_offset_goals.py
      - name: Validate staged diff
        run: |
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/apply-offset-goals.yml
          test ! -e tools/apply_offset_goals.py
      - name: Commit patched result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: offset fox goals and force zigzag routing [offset-goals-applied]"
          git push
